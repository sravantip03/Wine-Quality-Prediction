<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}VinoAI – Wine Quality Predictor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --wine:       #7b1c2e;
      --wine-light: #a83248;
      --wine-dark:  #4a0e1a;
      --gold:       #c9a84c;
      --gold-light: #e8c97a;
      --cream:      #f5f0e8;
      --bg:         #0e0b0c;
      --bg2:        #16100f;
      --bg3:        #1e1614;
      --surface:    #241a18;
      --surface2:   #2e201d;
      --border:     rgba(201,168,76,0.18);
      --text:       #f0e8dc;
      --text2:      #b8a898;
      --text3:      #7a6a60;
      --radius:     14px;
      --radius-lg:  22px;
      --shadow:     0 8px 40px rgba(0,0,0,0.6);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ── NAV ───────────────────────────────────────────────────────────── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      height: 64px;
      background: rgba(14,11,12,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .nav-brand .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--wine), var(--gold));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .nav-brand .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links { display: flex; gap: 0.2rem; }
    .nav-links a {
      text-decoration: none;
      color: var(--text2);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--gold);
      background: rgba(201,168,76,0.1);
    }

    /* ── WRAPPER ───────────────────────────────────────────────────────── */
    .page-wrapper {
      position: relative; z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
    }

    /* ── CARDS ─────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow);
    }
    .card-sm { padding: 1.25rem 1.5rem; }

    /* ── BUTTONS ───────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.7rem 1.5rem;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--wine), var(--wine-light));
      color: #fff;
      box-shadow: 0 4px 20px rgba(123,28,46,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(123,28,46,0.55); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #1a0e0a;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
    }
    .btn-gold:hover { transform: translateY(-2px); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
    .btn-sm { padding: 0.45rem 1rem; font-size: 0.8rem; }

    /* ── FORM ELEMENTS ─────────────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-size: 0.78rem; font-weight: 600;
      color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase;
    }
    .form-input {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 0.65rem 1rem;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.12);
    }

    /* ── BADGES ────────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.04em;
    }
    .badge-poor     { background: rgba(231,76,60,0.2);  color: #ff6b6b; }
    .badge-below    { background: rgba(230,126,34,0.2); color: #ffa04d; }
    .badge-average  { background: rgba(241,196,15,0.2); color: #ffd700; }
    .badge-good     { background: rgba(46,204,113,0.2); color: #5ddb8f; }
    .badge-excellent{ background: rgba(39,174,96,0.2);  color: #2ecc71; border: 1px solid rgba(39,174,96,0.4); }

    /* ── DIVIDER ───────────────────────────────────────────────────────── */
    .divider {
      border: none; border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── SECTION HEADER ────────────────────────────────────────────────── */
    .section-header { margin-bottom: 2rem; }
    .section-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }
    .section-header p { color: var(--text2); margin-top: 0.5rem; font-size: 1rem; }
    .section-header .gold-line {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin-top: 0.75rem;
      border-radius: 2px;
    }

    /* ── ALERTS ────────────────────────────────────────────────────────── */
    .alert {
      padding: 1rem 1.25rem; border-radius: 10px;
      font-size: 0.9rem; margin-bottom: 1rem;
    }
    .alert-error { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); color: #ff8a80; }

    /* ── SCROLLBAR ─────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--wine); border-radius: 3px; }

    /* ── FOOTER ────────────────────────────────────────────────────────── */
    .footer {
      text-align: center; padding: 2rem;
      color: var(--text3); font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }

    /* ── ANIMATIONS ────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(18px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .anim { animation: fadeUp 0.5s ease both; }
    .anim-1 { animation-delay: 0.05s; }
    .anim-2 { animation-delay: 0.12s; }
    .anim-3 { animation-delay: 0.19s; }
    .anim-4 { animation-delay: 0.26s; }

    @media (max-width: 768px) {
      .navbar { padding: 0 1rem; }
      .nav-links a { font-size: 0.78rem; padding: 0.4rem 0.6rem; }
      .page-wrapper { padding: 1.5rem 1rem 3rem; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="{% url 'home' %}" class="nav-brand">
      <div class="logo-icon">🍷</div>
      <span class="brand-name">VinoAI</span>
    </a>
    <div class="nav-links">
      <a href="{% url 'home' %}"      {% if request.resolver_match.url_name == 'home'      %}class="active"{% endif %}>Home</a>
      <a href="{% url 'predict' %}"   {% if request.resolver_match.url_name == 'predict'   %}class="active"{% endif %}>Predict</a>
      <a href="{% url 'history' %}"   {% if request.resolver_match.url_name == 'history'   %}class="active"{% endif %}>History</a>
      <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    </div>
  </nav>

  {% if messages %}
    <div style="max-width:1280px;margin:1rem auto;padding:0 2rem;">
      {% for msg in messages %}
        <div class="alert alert-error">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}

  <footer class="footer">
    <p>🍷 VinoAI — Wine Quality Prediction System &nbsp;·&nbsp; Powered by Random Forest &nbsp;·&nbsp; Mini Project 2024</p>
  </footer>
</body>
</html>
